name: 💎 Bot Video Reels Giornaliero (Diego Voice)

on:
  schedule:
    - cron: '0 7 * * *' # Ogni mattina alle 08:00 italiane
  workflow_dispatch:

jobs:
  genera_e_invia_reels:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Configura Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Installa dipendenze
        run: |
          pip install requests pillow edge-tts gtts imageio-ffmpeg urllib3

      - name: 🎬 Genera Video Reels e Invia su Telegram
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MINDSET_CHAT_ID: ${{ secrets.MINDSET_CHAT_ID }}
        run: |
          python bot_mindset_antonio_giancani.py
