name: 🧠 Bot Video Reels Mindset (Antonio Giancani)

on:
  schedule:
    # 08:30, 12:30, 16:30 ora italiana (UTC+2 estate / UTC+1 inverno)
    - cron: '30 6 * * *'
    - cron: '30 10 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:

jobs:
  genera_e_pubblica_reels:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Configura Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Installa dipendenze di sistema e Python
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-freefont-ttf
          pip install requests pillow edge-tts gtts imageio-ffmpeg urllib3 python-dotenv

      - name: 🎬 Genera Video Reels e Pubblica su Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINDSET_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot_mindset_antonio_giancani.py --auto-publish
